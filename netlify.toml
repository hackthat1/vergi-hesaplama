# Netlify konfigürasyonu - Vergi Hesaplama
[build]
  publish = "."

[[headers]]
  # Güvenlik header'ları
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=()"

[[headers]]
  # JSON dosyaları cache'lensin
  for = "*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  # JS/CSS cache
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# SPA fallback (index.html'e yönlendirme gerekmez, statik site)
# Netlify Identity widget için
[functions]
  directory = "netlify/functions"